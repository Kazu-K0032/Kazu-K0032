# Issues・PR・コミット数をGitHub APIで取得し、バッジ用JSONを更新するワークフロー
# 毎日UTC4時（JST13時）に自動実行する
name: Issues・PR・コミット数バッジ更新

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute issues, PR and commits counts
        id: counts
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: Kazu-K0032
        run: |
          set -euo pipefail
          echo "Fetching issues, PR and commits counts for $GH_USER"

          # Return total_count of a search query. Any API error, incomplete result
          # or non-numeric count fails the step so that the badges are not updated.
          search_count() {
            local endpoint="$1" query="$2" response count
            response=$(curl -fsS --retry 3 -G \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "q=$query" \
              --data-urlencode "per_page=1" \
              "https://api.github.com/search/$endpoint") || {
              echo "::error::Search API request failed: $query" >&2
              return 1
            }
            if [ "$(echo "$response" | jq -r '.incomplete_results')" != "false" ]; then
              echo "::error::Search result is incomplete: $query" >&2
              return 1
            fi
            count=$(echo "$response" | jq -r '.total_count')
            if ! [[ "$count" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid total_count ($count): $query" >&2
              return 1
            fi
            echo "$count"
          }

          # Count only items authored by the user (open + closed, public + private, any owner)
          TOTAL_ISSUES=$(search_count issues "author:$GH_USER is:issue")
          TOTAL_PRS=$(search_count issues "author:$GH_USER is:pr")
          TOTAL_COMMITS=$(search_count commits "author:$GH_USER")

          echo "total_issues=$TOTAL_ISSUES" >> "$GITHUB_OUTPUT"
          echo "total_prs=$TOTAL_PRS" >> "$GITHUB_OUTPUT"
          echo "total_commits=$TOTAL_COMMITS" >> "$GITHUB_OUTPUT"
          echo "Computed counts -> Issues: $TOTAL_ISSUES, PRs: $TOTAL_PRS, Commits: $TOTAL_COMMITS"

      - name: Update badge JSONs
        run: |
          mkdir -p badge

          # Update issues badge
          cat > badge/total-issues.json << EOF
          {
            "schemaVersion": 1,
            "label": "Total Issues",
            "message": "${{ steps.counts.outputs.total_issues }}",
            "color": "blue"
          }
          EOF

          # Update PRs badge
          cat > badge/total-prs.json << EOF
          {
            "schemaVersion": 1,
            "label": "Total PRs",
            "message": "${{ steps.counts.outputs.total_prs }}",
            "color": "green"
          }
          EOF

          # Update commits badge
          cat > badge/total-commits.json << EOF
          {
            "schemaVersion": 1,
            "label": "Total Commits",
            "message": "${{ steps.counts.outputs.total_commits }}",
            "color": "orange"
          }
          EOF

          echo "Updated badge files"

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add badge/total-issues.json badge/total-prs.json badge/total-commits.json
          git diff --staged --quiet || git commit -m "Update issues and PR counts [skip ci]"
          git pull --rebase
          git push
