# パブリック・プライベートのリポジトリ数をGitHub APIで取得し、バッジ用JSONを更新するワークフロー
# 毎日UTC3時（JST12時）に自動実行する
name: リポジトリ数バッジ更新

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute repo counts
        id: counts
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: Kazu-K0032
        run: |
          set -euo pipefail
          echo "Fetching repo counts for $GH_USER"

          # Return the number of owned repositories with the given privacy. Any API
          # error or non-numeric count fails the step so that the badges are not updated.
          repo_count() {
            local privacy="$1" payload response count
            payload=$(jq -n --arg login "$GH_USER" --arg privacy "$privacy" '{
              query: "query($login:String!,$privacy:RepositoryPrivacy!){ user(login:$login){ repositories(privacy:$privacy,ownerAffiliations:OWNER){ totalCount } } }",
              variables: {login: $login, privacy: $privacy}
            }')
            response=$(curl -fsS --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              https://api.github.com/graphql) || {
              echo "::error::GraphQL request failed: $privacy" >&2
              return 1
            }
            if echo "$response" | jq -e '.errors' > /dev/null; then
              echo "::error::GraphQL returned errors ($privacy): $(echo "$response" | jq -c '.errors')" >&2
              return 1
            fi
            count=$(echo "$response" | jq -r '.data.user.repositories.totalCount')
            if ! [[ "$count" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid totalCount ($count): $privacy" >&2
              return 1
            fi
            echo "$count"
          }

          PRIV=$(repo_count PRIVATE)
          PUB=$(repo_count PUBLIC)
          TOTAL=$((PRIV + PUB))
          echo "private=$PRIV" >> "$GITHUB_OUTPUT"
          echo "public=$PUB" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Computed counts -> private: $PRIV, public: $PUB, total: $TOTAL"

      - name: Update badge JSONs
        run: |
          mkdir -p badge
          cat > badge/private-repos.json << JSON
          {
            "schemaVersion": 1,
            "label": "Private Repos",
            "message": "${{ steps.counts.outputs.private }}",
            "color": "blue"
          }
          JSON
          cat > badge/public-repos.json << JSON
          {
            "schemaVersion": 1,
            "label": "Public Repos",
            "message": "${{ steps.counts.outputs.public }}",
            "color": "informational"
          }
          JSON
          cat > badge/total-repos.json << JSON
          {
            "schemaVersion": 1,
            "label": "Total Repos",
            "message": "${{ steps.counts.outputs.total }}",
            "color": "success"
          }
          JSON

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update repo badges private=${{ steps.counts.outputs.private }} public=${{ steps.counts.outputs.public }} total=${{ steps.counts.outputs.total }}"
          git pull --rebase
          git push
